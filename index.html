<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>はつおんれんしゅう</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Hiragino Maru Gothic ProN', 'BIZ UDPGothic', sans-serif;
    background: #FFF9F0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1.5rem 1rem 3rem;
  }

  h1 {
    font-size: 26px;
    font-weight: 700;
    color: #333;
    text-align: center;
    margin-bottom: 0.25rem;
  }

  .subtitle {
    font-size: 15px;
    color: #888;
    text-align: center;
    margin-bottom: 1.25rem;
  }

  .tabs {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
  }

  .tab {
    padding: 7px 18px;
    border-radius: 999px;
    font-size: 15px;
    cursor: pointer;
    border: 2px solid #ddd;
    background: #fff;
    color: #888;
    font-family: inherit;
    transition: all 0.15s;
  }

  .tab.active {
    background: #FFB347;
    color: #fff;
    border-color: #FFB347;
    font-weight: 700;
  }

  .card {
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 2rem 1.5rem 1.5rem;
    text-align: center;
    width: 100%;
    max-width: 400px;
  }

  .emoji {
    font-size: 100px;
    line-height: 1;
    margin-bottom: 0.75rem;
    display: block;
  }

  .word {
    font-size: 36px;
    font-weight: 700;
    color: #333;
    margin-bottom: 1.25rem;
    letter-spacing: 0.08em;
  }

  .btn-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: none;
    border-radius: 999px;
    padding: 12px 22px;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.1s;
  }

  .btn:active { transform: scale(0.95); opacity: 0.8; }

  .btn-play { background: #4FC3F7; color: #fff; }
  .btn-rec  { background: #EF5350; color: #fff; }
  .btn-rec.recording { animation: recpulse 0.5s ease-in-out infinite alternate; }

  @keyframes recpulse {
    from { opacity: 1; }
    to   { opacity: 0.5; }
  }

  .result-box {
    min-height: 44px;
    background: #F5F5F5;
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 14px;
    color: #555;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.5;
  }

  .divider {
    border: none;
    border-top: 1.5px dashed #eee;
    margin: 0.75rem 0;
  }

  .judge-label {
    font-size: 13px;
    color: #aaa;
    margin-bottom: 0.6rem;
  }

  .judge-row {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-bottom: 1rem;
  }

  .judge-btn {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    border: 2.5px solid #eee;
    background: #fff;
    font-size: 30px;
    cursor: pointer;
    transition: transform 0.1s, background 0.15s, border-color 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
  }

  .judge-btn:active { transform: scale(0.9); }
  .judge-btn.sel-x { background: #FFEBEE; border-color: #EF5350; }
  .judge-btn.sel-d { background: #FFF8E1; border-color: #FFB300; }
  .judge-btn.sel-o { background: #E8F5E9; border-color: #43A047; }

  .next-btn {
    display: block;
    width: 100%;
    padding: 14px;
    border-radius: 999px;
    border: none;
    background: #66BB6A;
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }

  .next-btn:disabled {
    background: #ccc;
    cursor: not-allowed;
  }

  .next-btn:not(:disabled):active { transform: scale(0.97); }

  .nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-top: 1.25rem;
    width: 100%;
    max-width: 400px;
  }

  .nav-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 2px solid #ddd;
    background: #fff;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s;
  }

  .nav-btn:active { background: #f0f0f0; }

  .counter {
    font-size: 16px;
    color: #aaa;
    min-width: 64px;
    text-align: center;
  }

  .speed-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 1rem;
    justify-content: center;
  }

  .speed-row label { font-size: 13px; color: #aaa; }
  .speed-val { font-size: 13px; font-weight: 700; color: #555; min-width: 90px; text-align: left; }

  input[type=range] {
    width: 110px;
    accent-color: #FFB347;
  }
</style>
</head>
<body>

<h1>はつおんれんしゅう 🎤</h1>
<p class="subtitle">きいて・いって・かくにんしよう</p>

<div class="tabs">
  <button class="tab active" onclick="setCategory('all',this)">ぜんぶ</button>
  <button class="tab" onclick="setCategory('dousa',this)">うごき</button>
  <button class="tab" onclick="setCategory('nichijo',this)">にちじょう</button>
</div>

<div class="card">
  <span class="emoji" id="emoji">🏃</span>
  <div class="word" id="word">はしる</div>

  <div class="btn-row">
    <button class="btn btn-play" onclick="playWord()">🔊 おとをきく</button>
    <button class="btn btn-rec" id="recBtn" onclick="toggleRec()">🎙️ <span id="recLabel">はなす</span></button>
  </div>

  <div class="result-box" id="resultBox">👆 まず「おとをきく」をおそう</div>

  <hr class="divider">

  <p class="judge-label">せんせいがはんていする</p>
  <div class="judge-row">
    <button class="judge-btn" id="jx" onclick="judge('x')"  title="ばつ">✖</button>
    <button class="judge-btn" id="jd" onclick="judge('d')"  title="さんかく">△</button>
    <button class="judge-btn" id="jo" onclick="judge('o')"  title="まる">〇</button>
  </div>

  <button class="next-btn" id="nextBtn" onclick="nextWord()" disabled>つぎへ ▶</button>
</div>

<div class="nav">
  <button class="nav-btn" onclick="prevWord()" title="まえ">◀</button>
  <span class="counter" id="counter">1 / 16</span>
  <button class="nav-btn" onclick="skipNext()" title="つぎ">▶</button>
</div>

<div class="speed-row">
  <label>おそい</label>
  <input type="range" min="1" max="5" value="2" id="speedRange" oninput="updateSpeed(this.value)">
  <label>はやい</label>
  <span class="speed-val" id="speedVal">ゆっくり</span>
</div>

<script>
const words = [
  { text:'はしる',      emoji:'🏃',  cat:'dousa'  },
  { text:'とぶ',        emoji:'🦅',  cat:'dousa'  },
  { text:'たべる',      emoji:'🍙',  cat:'dousa'  },
  { text:'のむ',        emoji:'🧃',  cat:'dousa'  },
  { text:'ねる',        emoji:'😴',  cat:'dousa'  },
  { text:'あそぶ',      emoji:'⚽',  cat:'dousa'  },
  { text:'かく',        emoji:'✏️', cat:'dousa'  },
  { text:'よむ',        emoji:'📖',  cat:'dousa'  },
  { text:'おはよう',    emoji:'🌅',  cat:'nichijo' },
  { text:'ありがとう',  emoji:'🙏',  cat:'nichijo' },
  { text:'ごめんなさい',emoji:'😢',  cat:'nichijo' },
  { text:'いただきます',emoji:'🍽️',cat:'nichijo' },
  { text:'おやすみ',    emoji:'🌙',  cat:'nichijo' },
  { text:'いってきます',emoji:'👋',  cat:'nichijo' },
  { text:'ただいま',    emoji:'🏠',  cat:'nichijo' },
  { text:'きもちいい',  emoji:'😊',  cat:'nichijo' },
];

const speedMap   = {1:0.45, 2:0.55, 3:0.70, 4:0.85, 5:1.00};
const speedNames = {1:'とてもおそい', 2:'ゆっくり', 3:'ふつう', 4:'すこしはやい', 5:'はやい'};

let filtered = [...words];
let idx = 0;
let speed = 0.55;
let isRecording = false;
let recognition = null;
let currentJudge = null;

function updateSpeed(v) {
  speed = speedMap[v];
  document.getElementById('speedVal').textContent = speedNames[v];
}

function setCategory(cat, el) {
  filtered = cat === 'all' ? [...words] : words.filter(w => w.cat === cat);
  idx = 0;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  loadCard();
}

function loadCard() {
  const w = filtered[idx];
  document.getElementById('emoji').textContent   = w.emoji;
  document.getElementById('word').textContent    = w.text;
  document.getElementById('counter').textContent = (idx+1) + ' / ' + filtered.length;
  document.getElementById('resultBox').textContent = '👆 まず「おとをきく」をおそう';
  document.getElementById('nextBtn').disabled = true;
  document.getElementById('recBtn').classList.remove('recording');
  document.getElementById('recLabel').textContent = 'はなす';
  ['jx','jd','jo'].forEach(id => document.getElementById(id).className = 'judge-btn');
  currentJudge = null;
  isRecording = false;
  if (recognition) { try { recognition.stop(); } catch(e){} recognition = null; }
}

function playWord() {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(filtered[idx].text);
  u.lang = 'ja-JP'; u.rate = speed; u.pitch = 1.1;
  document.getElementById('resultBox').textContent = '🔊 きいてね…';
  u.onend = () => {
    document.getElementById('resultBox').textContent = '🎤 「はなす」をおして いってみよう！';
  };
  window.speechSynthesis.speak(u);
}

function toggleRec() {
  isRecording ? stopRec() : startRec();
}

function startRec() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    document.getElementById('resultBox').textContent = 'このブラウザはマイクにたいおうしていません。Safariをつかってね。';
    return;
  }
  recognition = new SR();
  recognition.lang = 'ja-JP';
  recognition.interimResults = false;
  recognition.maxAlternatives = 3;

  recognition.onstart = () => {
    isRecording = true;
    document.getElementById('recBtn').classList.add('recording');
    document.getElementById('recLabel').textContent = 'きろく中…';
    document.getElementById('resultBox').textContent = '🎙️ はなしてね…';
  };

  recognition.onresult = (e) => {
    const target = filtered[idx].text;
    let matched = false;
    let heard = '';
    for (let i = 0; i < e.results[0].length; i++) {
      const t = e.results[0][i].transcript.replace(/\s/g,'');
      if (i === 0) heard = t;
      if (t === target) { matched = true; break; }
    }
    if (matched) {
      document.getElementById('resultBox').textContent = '✨ じどうはんてい：「' + heard + '」→ よくできました！';
      setJudge('o');
    } else {
      document.getElementById('resultBox').textContent = '🤔 じどうはんてい：「' + heard + '」とよめました。せんせいがかくにんしてね。';
    }
  };

  recognition.onerror = () => {
    document.getElementById('resultBox').textContent = 'きこえませんでした。もういちどためしてね。';
    stopRec();
  };

  recognition.onend = () => stopRec();
  recognition.start();
}

function stopRec() {
  isRecording = false;
  document.getElementById('recBtn').classList.remove('recording');
  document.getElementById('recLabel').textContent = 'はなす';
  if (recognition) { try { recognition.stop(); } catch(e){} recognition = null; }
}

function judge(type) { setJudge(type); }

function setJudge(type) {
  currentJudge = type;
  document.getElementById('jx').className = 'judge-btn' + (type==='x' ? ' sel-x' : '');
  document.getElementById('jd').className = 'judge-btn' + (type==='d' ? ' sel-d' : '');
  document.getElementById('jo').className = 'judge-btn' + (type==='o' ? ' sel-o' : '');
  document.getElementById('nextBtn').disabled = (type !== 'o');
}

function nextWord() {
  if (currentJudge !== 'o') return;
  idx = (idx + 1) % filtered.length;
  loadCard();
}

function skipNext() {
  idx = (idx + 1) % filtered.length;
  loadCard();
}

function prevWord() {
  idx = (idx - 1 + filtered.length) % filtered.length;
  loadCard();
}
</script>
</body>
</html>
